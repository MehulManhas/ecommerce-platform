server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/roles/**,/api/users/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: product-service
          uri: http://localhost:9090
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: order-service
          uri: http://localhost:9091
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: payment-service
          uri: ${PAYMENTSERVICE_URI:http://localhost:9095}
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: inventory-service
          uri: ${INVENTORYSERVICE_URI:http://localhost:9094}
          predicates:
            - Path=/api/inventory/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
