server.port=9090
#FakeStoreURLs
fakestore.api.url = https://fakestoreapi.com/
fakestore.api.path.product = /products
fakestore.api.path.category = /category

#DB properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show-sql=true
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/ECommerceDB
spring.datasource.username=postgres
spring.datasource.password=password

#Inter-service: User Service base URL used to validate caller tokens
userservice.base-url=http://localhost:8081

#Redis cache (set spring.cache.type=none to benchmark the uncached baseline)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

#Kafka (consumer of order.placed)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
