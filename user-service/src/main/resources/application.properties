#Server properties
server.port=8081
#DB properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show-sql=true
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/ECommerceDB
spring.datasource.username=postgres
spring.datasource.password=password
#JWT properties - the committed fallback is a DEV-ONLY placeholder, NOT a real secret.
# Always provide a strong, private JWT_SECRET (Base64, >= 32 bytes) via environment variable in any real deployment.
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktaW5zZWN1cmUtc2lnbmluZy1rZXktY2hhbmdlLW1lLXZpYS1KV1RfU0VDUkVULWVudi12YXI=}

#Kafka (producer of user.signup)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
